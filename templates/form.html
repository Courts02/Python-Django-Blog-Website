{% load static %}
<link href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
<script src="https://unpkg.com/htmx.org@1.7.0"></script>

<form hx-post="{% url 'create_post' %}" enctype="multipart/form-data">
    {% csrf_token %}

    <!-- Input for Post Name -->
    <label for="postname">Post Name:</label>
    <input type="text" id="postname" name="postname" required><br>

    <!-- Textarea for Post Content -->
    <label for="content">Content:</label>
    <textarea id="content" name="content" required></textarea><br>

    <!-- Input for Post Category -->
    <label for="category">Category:</label>
    <input type="text" id="category" name="category"><br>

    <!-- File input for Image Upload -->
    <label for="image">Upload Image:</label>
    <input type="file" id="image" name="image"><br>

    <!-- Submit button triggers an HTMX POST request to create_post -->
    <button type="submit">Create Post</button>
</form>

<!-- Notes:
 - The form uses hx-post to send data asynchronously to the 'create_post' view.
 - enctype="multipart/form-data" ensures file uploads are handled properly.
 - Each input field corresponds to a field in the Post model.
 - The form submission is handled without a full page reload, improving user experience.
 -->
